name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag
        run: |
          version="$(sed -n 's/.*version := v!"\([^"]*\)".*/\1/p' lakefile.lean)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"

      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: true

      - name: Run extended test suite
        run: lake test -- --ignored --jobs 4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LeanTest $GITHUB_REF_NAME" \
            --generate-notes
